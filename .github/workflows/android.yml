name: Android CI

on:
  push:
    branches: [ main, pjsip-amrwb ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK and CMake
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null

    # PJSIP/OpenSSL/Opus take several minutes per ABI; rebuild only when the recipe changes.
    - name: Cache native libraries
      uses: actions/cache@v4
      with:
        path: |
          native/build/*/
          !native/build/work
          native/.downloads
        key: native-${{ runner.os }}-${{ hashFiles('native/build-deps.sh', 'native/config_site.h') }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload debug APKs
      uses: actions/upload-artifact@v7
      with:
        name: sip-dialer-debug-apks
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        compression-level: 0  # APKs are already compressed
